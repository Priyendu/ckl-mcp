name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # SDK 10 understands the .slnx solution; runtime 8 runs the net8.0 tests.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test
        run: dotnet test CklMcp.slnx -c Release
