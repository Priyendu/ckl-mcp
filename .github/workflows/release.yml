name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual runs build the packages and upload them as workflow artifacts, without creating a release

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          # SDK 10 understands the .slnx solution; runtime 8 runs the net8.0 tests.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test
        run: dotnet test CklMcp.slnx -c Release

      - name: Publish framework-dependent
        run: dotnet publish src/CklMcp.Server -c Release -r win-x64 -p:SelfContained=false -p:PublishSingleFile=true -p:DebugType=none -o publish/fd

      - name: Publish self-contained
        run: dotnet publish src/CklMcp.Server -c Release -r win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish/sc

      # Note: use $env:GITHUB_REF_NAME instead of `${{ github.ref_name }}` inside scripts —
      # inline expression interpolation into a script is a script-injection vector.
      - name: Zip artifacts
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($env:GITHUB_REF_TYPE -ne 'tag') { $version = 'ci' }
          Compress-Archive -Path publish/fd/* -DestinationPath "CklMcp-$version-win-x64-framework-dependent.zip"
          Compress-Archive -Path publish/sc/* -DestinationPath "CklMcp-$version-win-x64-self-contained.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: "*.zip"

  # Built on a Linux runner so the executable bit survives inside the tarballs.
  unix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Publish and pack
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then version=ci; fi
          for rid in linux-x64 osx-arm64; do
            dotnet publish src/CklMcp.Server -c Release -r "$rid" \
              -p:SelfContained=true -p:PublishSingleFile=true \
              -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:DebugType=none -o "publish/$rid"
            tar -czf "CklMcp-$version-$rid-self-contained.tar.gz" -C "publish/$rid" .
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-unix
          path: "*.tar.gz"

  release:
    if: github.ref_type == 'tag'
    needs: [windows, unix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ckl-mcp $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "MCP stdio server for DISA STIG checklists. Point your MCP client (Claude, Codex, Gemini CLI, VS Code Copilot, Cursor) at the executable; the README has a config snippet for each. Windows: the framework-dependent zip needs the [.NET 8 Runtime](https://dotnet.microsoft.com/download/dotnet/8.0); the self-contained zip needs nothing. Linux and macOS: self-contained tarballs; run \`chmod +x CklMcp.Server\` if needed. macOS builds are not code-signed, so if Gatekeeper blocks the file run \`xattr -d com.apple.quarantine CklMcp.Server\`. The macOS build is untested by the maintainer. Unclassified data only."
